[package]
name = "crorecut"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "15c0e397a81933ca88a9a338caaac2a4689354f9", features = ["tokio", "advanced", "image", "canvas", "svg"] }
tokio = { version = "1.48", features = ["process", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
dirs = "6.0"
log = "0.4"
env_logger = "0.11"
image = "0.25"
open = "5"
cpal = "0.16"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
opt-level = 3
panic = "abort"
lto = true
