name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: crorecut.exe
            asset: crorecut-${{ github.ref_name }}-windows-x64.exe
          - os: ubuntu-latest
            binary: crorecut
            asset: crorecut-${{ github.ref_name }}-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      # TODO: commit Cargo.lock and build with `--locked`
      - name: Build
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: mv "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes $PRERELEASE
